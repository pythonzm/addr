<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0EA5E9" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- 经纬网微装饰线 -->
  <path d="M6 32h52M32 6v52M12 18c6 8 6 20 0 28M52 18c-6 8-6 20 0 28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" stroke-linecap="round" />

  <!-- 地理定位 Pin 图标 -->
  <g filter="url(#shadow)">
    <!-- 实体 Pin 主体 -->
    <path d="M32 12c-7.73 0-14 6.27-14 14 0 10.5 14 26 14 26s14-15.5 14-26c0-7.73-6.27-14-14-14z" fill="url(#pinGrad)" />
    <!-- Pin 内部小圆/建筑象征 -->
    <circle cx="32" cy="26" r="5" fill="#0284C7" />
    <!-- 中心高亮光点 -->
    <circle cx="32" cy="26" r="2.2" fill="#38BDF8" />
  </g>
</svg>
