<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真实地址生成器 · Real Address Generator</title>
  <meta name="description" content="从 OpenStreetMap 随机获取各国真实存在的门牌级地址，配合随机生成的姓名、电话、邮箱，仅供测试与开发使用。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="container">
    <header class="header">
      <h1>真实地址生成器</h1>
      <p class="subtitle">随机获取世界各国<strong>真实存在</strong>的门牌级地址，地址直接取自 OpenStreetMap 实测数据</p>
      <p class="disclaimer">姓名、电话、邮箱为随机生成，仅供软件测试、演示与开发使用；禁止用于欺诈、收货、身份验证或任何法律用途。</p>
    </header>

    <section class="card controls">
      <label class="control">
        <span>选择国家 / 地区</span>
        <select id="countrySelect"></select>
      </label>
      <button id="genBtn" class="btn btn-primary" onclick="generate()">
        <span id="genText">换一个地址</span>
        <span id="spinner" class="spinner hidden"></span>
      </button>
      <button class="btn btn-secondary" onclick="saveCurrent()">保存</button>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-head">
          <h2>生成结果</h2>
          <button class="btn btn-ghost" onclick="copyAll()">复制全部</button>
        </div>
        <p class="hint">点击任意字段即可复制</p>
        <div id="result" class="fields">
          <div class="empty">点击"换一个地址"开始</div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>位置地图</h2>
          <span id="qualityBadge" class="badge hidden">门牌级 · 真实</span>
        </div>
        <div id="map"></div>
        <p class="hint" id="osmProof">地图数据 © OpenStreetMap 贡献者</p>
      </section>
    </div>

    <section class="card saved">
      <div class="card-head">
        <h2>已保存的地址</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="exportCSV()">导出 CSV</button>
          <button class="btn btn-secondary" onclick="exportJSON()">导出 JSON</button>
          <button class="btn btn-danger" onclick="clearAll()">清空</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>操作</th><th>备注</th><th>姓名</th><th>电话</th><th>地址</th><th>时间</th>
            </tr>
          </thead>
          <tbody id="savedBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <p>地址数据来源：<a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a>（ODbL 许可）· 每个地址均可在 OSM 上查证</p>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
